name: Treaty checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install GenVM linter
        run: python -m pip install genvm-linter==0.11.0
      - name: Deterministic preflight
        run: python scripts/preflight.py
      - name: Direct-mode tests
        run: pytest tests/direct -v
      - name: GenVM lint
        run: genvm-lint check contracts/treaty.py --json
